[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lisztserv"
version = "1.0.0"
description = "A tool for scraping music information and creating Spotify playlists"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "88dreams"}
]
dependencies = [
    "flask>=2.0.1",
    "pywebview>=4.0",
    "flask-cors>=4.0.0",
    "spotipy>=2.19.0",
    "openai>=0.27.0",
    "playwright>=1.20.0",
    "aiofiles>=24.1.0",
    "aiohappyeyeballs>=2.4.4",
    "aiohttp>=3.11.11",
    "beautifulsoup4>=4.12.3",
    "requests>=2.32.3",
    "python-dotenv>=1.0.1",
    "tqdm>=4.67.1",
    "tzdata>=2024.2",
    "email-validator>=2.1.0",
    "pillow>=10.2.0",
    "psutil>=5.9.8",
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    "stripe>=7.0.0",
    "passlib>=1.7.4",
    "bcrypt>=4.0.1",
    "python-jose>=3.3.0",
    "psycopg2-binary>=2.9.9"
]

[project.optional-dependencies]
dev = [
    "build",
    "twine",
    "pytest"
]
unix = [
    "uvloop>=0.19.0"
]

[project.scripts]
lisztserv = "lisztserv.app:main"
lisztserv-gui = "lisztserv.app:main"

[tool.setuptools]
include-package-data = true
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["lisztserv*"]
exclude = ["tests*"]

[tool.setuptools.package-data]
"lisztserv" = [
    "frontend/static/css/*",
    "frontend/static/js/*",
    "frontend/templates/*",
    "config.json.example",
    ".env.example"
] 