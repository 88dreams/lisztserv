[build-system]
requires = ["setuptools>=45", "wheel", "setuptools_scm>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "lisztserv"
dynamic = ["version"]
description = "A modern desktop application for creating Spotify playlists from web content"
readme = "README.md"
requires-python = ">=3.8"
license = {file = "LICENSE"}
authors = [
    {name = "88dreams", email = "contact@88dreams.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: Flask",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.8",
    "Topic :: Multimedia :: Sound/Audio",
]
dependencies = [
    "flask>=2.0.0",
    "spotipy>=2.19.0",
    "openai>=0.27.0",
    "playwright>=1.20.0",
    "sqlalchemy>=1.4.0",
    "alembic>=1.7.0",
    "stripe>=2.60.0",
    "pywebview>=3.6.0",
    "python-dotenv>=0.19.0",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0.0",
    "pytest-cov>=3.0.0",
    "pytest-mock>=3.6.0",
    "pytest-asyncio>=0.16.0",
]
dev = [
    "black>=22.0.0",
    "isort>=5.9.0",
    "flake8>=4.0.0",
    "mypy>=0.910",
]

[tool.setuptools]
packages = ["lisztserv"]
package-dir = {"" = "src"}

[tool.setuptools_scm]
write_to = "src/lisztserv/_version.py"

[tool.black]
line-length = 88
target-version = ["py38"]
include = '\.pyi?$'

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --cov=lisztserv --cov-report=html"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "integration: marks tests as integration tests",
    "performance: marks tests as performance tests",
]

[tool.pyinstaller]
hiddenimports = [
    "engineio.async_drivers.threading",
    "sqlalchemy.ext.baked",
    "sqlalchemy.ext.declarative",
]
datas = [
    ("src/lisztserv/frontend/templates", "frontend/templates"),
    ("src/lisztserv/frontend/static", "frontend/static"),
]
excludes = [
    "tkinter",
    "test",
    "unittest",
]
runtime-hooks = ["hook-lisztserv.py"] 